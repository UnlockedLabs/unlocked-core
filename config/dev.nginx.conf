server {
  listen 80;
  server_name localhost;
  # Docker's embedded DNS. Lets /tutor resolve tutor-service lazily per-request
  # instead of nginx doing it once at startup and refusing to boot ("host not
  # found in upstream") whenever tutor-service is slow, missing, or its image
  # can't be pulled — the rest of the app must come up regardless.
  resolver 127.0.0.11 valid=10s;
  proxy_headers_hash_bucket_size 256;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

   location /api/ {
        proxy_pass http://server:8080;
        proxy_buffering on;
        proxy_cache_methods GET HEAD;
        proxy_http_version 1.1;
		proxy_set_header Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Open Content's paths go to its own service (EN-205), as the cluster's
    # ingress sends them. A regex location wins over /api/ above. Resolved
    # per request, like /tutor below, so nginx starts without it.
    location ~ ^/api/(libraries|videos|helpful-links|open-content|tags|proxy)(/|$) {
        set $open_content_upstream http://open-content:8080;
        proxy_pass $open_content_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Programs' paths go to its own service (EN-207), the same way.
    location ~ ^/api/(programs|program-classes|classes|program-users|program-facilities|instructors|rooms|admin-calendar|student-calendar|reports)(/|$) {
        set $programs_upstream http://programs:8080;
        proxy_pass $programs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions/ {
      proxy_pass http://kratos:4433;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /oauth2/ {
      proxy_pass http://hydra:4444;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Connection 'upgrade';
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location /self-service/ {
      proxy_pass http://kratos:4433;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /userinfo {
      proxy_pass http://hydra:4444;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection 'upgrade';
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tutor {
      set $tutor_upstream http://tutor-service:3000;
      proxy_pass $tutor_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      # The tutor is embedded in an iframe — an unstyled nginx 502/503/504 would
      # otherwise render raw inside UnlockEd's own chrome.
      proxy_intercept_errors on;
      error_page 502 503 504 = @tutor_unavailable;
    }

    location @tutor_unavailable {
      default_type text/html;
      return 503 '<!doctype html><html><body style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:system-ui,sans-serif;color:#444;text-align:center"><div><h2>AI Tutor is temporarily unavailable</h2><p>Please try again in a few minutes.</p></div></body></html>';
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
