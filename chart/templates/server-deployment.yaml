{{- $host := include "unlocked-core.host" . }}
{{- $logs := include "unlocked-core.volume" (list . "logs") | fromYaml }}
{{- $thumbs := include "unlocked-core.volume" (list . "thumbnails") | fromYaml }}
{{- $jasper := include "unlocked-core.volume" (list . "jaspertmp") | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  strategy:
    type: {{ include "unlocked-core.strategy" (list . "server") }}
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
      - name: wait-for-nats
        image: {{ .Values.waitForNats.image }}
        command: ["sh", "-c", "until nc -z -w 2 {{ .Values.nats.host }} {{ .Values.nats.port }}; do echo waiting for nats; sleep 2; done"]
      containers:
      - args:
        - ./backend
        env:
        - name: APP_ENV
          value: {{ .Values.appEnv | quote }}
        {{- /*
        APP_KEY is required here: a site that genuinely wants the legacy
        empty-key behavior (today's prod, whose existing LMS keys are stored
        encrypted with an empty key) sets APP_KEY to an explicit empty string
        in the Secret, rather than relying on it being silently absent.
        */}}
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: APP_KEY
        - name: APP_URL
          value: https://{{ $host }}
        {{- include "unlocked-core.dbEnv" . | nindent 8 }}
        {{- if .Values.hydra.enabled }}
        - name: HYDRA_ADMIN_URL
          value: {{ .Values.hydra.adminUrl | quote }}
        - name: HYDRA_PUBLIC_URL
          value: {{ .Values.hydra.publicUrl | quote }}
        {{- end }}
        - name: KRATOS_ADMIN_URL
          value: {{ .Values.kratos.adminUrl | quote }}
        - name: KRATOS_PUBLIC_URL
          value: {{ .Values.kratos.publicUrl | quote }}
        - name: MIDDLEWARE_CRON_SCHEDULE
          value: {{ .Values.middlewareCron | quote }}
        {{- /*
        Not a values knob: this chart always deploys the scheduler below, so
        the server must never also run background jobs internally, or every
        job gets published twice. Matches EN-191's own docker-compose.
        */}}
        - name: RUN_SCHEDULER
          value: "false"
        - name: IMG_FILEPATH
          value: /thumbnails
        - name: NATS_URL
          value: nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}
        - name: NATS_USER
          value: {{ .Values.nats.user | quote }}
        - name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: NATS_PASSWORD
        - name: LOG_LEVEL
          value: {{ .Values.server.logLevel | quote }}
        - name: ORY_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: ORY_TOKEN
        - name: PROVIDER_SERVICE_URL
          value: {{ .Values.providerServiceUrl | quote }}
        - name: MIGRATION_DIR
          value: "./migrations"
        - name: S3_BUCKET_NAME
          value: {{ required "s3.bucket must be set" .Values.s3.bucket | quote }}
        - name: AWS_REGION
          value: {{ required "s3.region must be set" .Values.s3.region | quote }}
        - name: KIWIX_SERVER_URL
          value: {{ required "kiwixServerUrl must be set" .Values.kiwixServerUrl | quote }}
        - name: TO_EMAIL
          value: {{ .Values.supportEmails.to | quote }}
        - name: FROM_EMAIL
          value: {{ .Values.supportEmails.from | quote }}
        - name: CORS_ALLOWED_ORIGINS
          value: https://{{ $host }}
        - name: JASPER_TEMP_DIR
          value: /jaspertmp
        {{- with .Values.proxySchemeOverride }}
        - name: PROXY_SCHEME_OVERRIDE
          value: {{ . | quote }}
        {{- end }}
        image: {{ include "unlocked-core.image" (list . "server") }}
        {{- include "unlocked-core.pullPolicy" (list . "server") | nindent 8 }}
        name: unlockedv2
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /thumbnails
          name: {{ $thumbs.podVolume }}
        - mountPath: /logs
          name: {{ $logs.podVolume }}
        - mountPath: /jaspertmp
          name: {{ $jasper.podVolume }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecretName }}
      restartPolicy: Always
      volumes:
      - name: {{ $thumbs.podVolume }}
        persistentVolumeClaim:
          claimName: {{ $thumbs.pvcName }}
      - name: {{ $logs.podVolume }}
        persistentVolumeClaim:
          claimName: {{ $logs.pvcName }}
      - name: {{ $jasper.podVolume }}
        persistentVolumeClaim:
          claimName: {{ $jasper.pvcName }}
