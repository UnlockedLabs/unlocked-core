# Every commit on a branch must be a conventional commit: release-please builds
# versions and the changelog from commit subjects. Merge commits are skipped.
# Same check as the other UnlockEd repos (see docs/repo-standard.md in
# unlocked-core).
name: conventional commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # the loop reads git log through process substitution, so a bad range would pass silently
          git rev-list "$BASE..$HEAD" > /dev/null
          pattern='^(feat|fix|chore|docs|refactor|test|ci|build|perf|revert|style)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::not a conventional commit: $subject"
              if [[ $subject == 'Revert "'* ]]; then
                inner=${subject#Revert \"}
                echo "::error::reword it to: revert: ${inner%\"}"
              fi
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit $bad
