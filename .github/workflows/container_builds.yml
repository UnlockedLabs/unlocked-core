name: Container ECR build + deploy
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  setup-env:
    if: github.repository == 'UnlockedLabs/unlocked-core' || github.repository == 'PThorpe92/UnlockEdv2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check duplicate migration files
        run: |
          DUPLICATE_MIGRATIONS=$(ls -1 backend/migrations | grep '.*\.sql' | cut -c1-5 | sort | uniq -d)
          if [ -z "$DUPLICATE_MIGRATIONS" ]; then
            echo "no invalid migrations found"
          else
            echo "🚨 Duplicate migration files found 🚨"
            echo "Migration number: $DUPLICATE_MIGRATIONS is a duplicate\n and needs to be renamed"
            exit 1
          fi

  build-and-push:
    if: github.repository == 'UnlockedLabs/unlocked-core' || github.repository == 'PThorpe92/UnlockEdv2'
    needs: setup-env
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      queue: max

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$TAG' is not a vMAJOR.MINOR.PATCH release tag — refusing to build release images"
              exit 1
            fi
            echo "IMAGE_VERSION=${TAG#v}" >> $GITHUB_ENV
            # GITHUB_REF_NAME is the tag itself on this path, not a branch —
            # report "unknown" rather than a tag name masquerading as a branch.
            echo "IMAGE_GIT_BRANCH=unknown" >> $GITHUB_ENV
          else
            echo "IMAGE_VERSION=sha-${GITHUB_SHA:0:7}" >> $GITHUB_ENV
            echo "IMAGE_GIT_BRANCH=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Expose GitHub runtime for the build cache
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - id: build-images
        run: |
          # Every push builds and tags both images — a partial set (gated
          # on which folder changed) can't be pinned per-site, can't tell you
          # what staging actually tested, and drops a build's changes entirely
          # if a later push's run replaces it in the concurrency queue.
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          LABELS=(
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.version=$IMAGE_VERSION"
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          )

          echo "Building frontend image"
          # Site name and PostHog key are read at runtime from each
          # deployment's /config.js (EN-176) instead of baked in here —
          # one image now works on every site.
          TAGS=(-t "$REGISTRY/frontend:${IMAGE_VERSION}")
          docker buildx build --platform linux/amd64 \
            --cache-from type=gha,scope=frontend --cache-to type=gha,scope=frontend,mode=max \
            "${LABELS[@]}" "${TAGS[@]}" --push frontend/.

          echo "Building backend image"
          TAGS=(-t "$REGISTRY/unlockedv2:${IMAGE_VERSION}")
          docker buildx build --platform linux/amd64 \
            --cache-from type=gha,scope=backend --cache-to type=gha,scope=backend,mode=max \
            --build-arg GIT_COMMIT="$GITHUB_SHA" --build-arg GIT_BRANCH="$IMAGE_GIT_BRANCH" --build-arg APP_VERSION="$IMAGE_VERSION" \
            "${LABELS[@]}" "${TAGS[@]}" --push -f backend/Dockerfile .

  # Staging follows main (EN-184): commit this build's tag to staging's site
  # file in unlocked-platform. That push starts its deploy workflow, which runs
  # helm upgrade and the migrations, then checks /api/version.
  update-staging:
    if: github.repository == 'UnlockedLabs/unlocked-core' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: update-staging
      cancel-in-progress: false

    steps:
      # The unlocked-release-bot app may push to unlocked-platform's main past
      # its review rule; that repo's deploy workflow refuses any bot push that
      # changes more than image tags.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: UnlockedLabs
          repositories: unlocked-platform
          permission-contents: write

      - name: Checkout unlocked-platform
        uses: actions/checkout@v4
        with:
          repository: UnlockedLabs/unlocked-platform
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit the new tag to staging
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA:0:7}"
          SITE_FILE=sites/staging.yaml
          BOT_ID="$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          site_tag() {
            sed -n "/^  $1:\$/,/^    tag:/ s/^    tag: *//p" "$SITE_FILE"
          }

          # Retries when another push lands on unlocked-platform's main first.
          for attempt in 1 2 3 4 5; do
            # A re-run of an older build must not roll staging back.
            CURRENT="$(site_tag server)"
            if [[ "$CURRENT" == sha-* ]]; then
              STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${CURRENT#sha-}...${GITHUB_SHA}" --jq .status)"
              if [[ "$STATUS" != ahead ]]; then
                echo "Staging runs $CURRENT, and $TAG isn't newer ($STATUS); leaving it."
                exit 0
              fi
            fi

            sed -i -E "/^  (frontend|server):\$/,/^    tag:/ s/^(    tag:).*/\1 ${TAG}/" "$SITE_FILE"
            for image in frontend server; do
              if [[ "$(site_tag "$image")" != "$TAG" ]]; then
                echo "::error::couldn't set images.${image}.tag in ${SITE_FILE}"
                exit 1
              fi
            done

            git commit -qam "chore(staging): deploy unlocked-core ${TAG}" \
              -m "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            if git push -q origin HEAD:main; then
              echo "Staging set to $TAG; unlocked-platform's deploy workflow takes it from here."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying on the new main"
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            sleep $((attempt * 5))
          done
          echo "::error::couldn't push to unlocked-platform's main"
          exit 1
