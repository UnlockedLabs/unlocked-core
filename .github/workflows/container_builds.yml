name: Container ECR build + deploy
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  setup-env:
    if: github.repository == 'UnlockedLabs/unlocked-core' || github.repository == 'PThorpe92/UnlockEdv2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check duplicate migration files
        run: |
          DUPLICATE_MIGRATIONS=$(ls -1 backend/migrations | grep '.*\.sql' | cut -c1-5 | sort | uniq -d)
          if [ -z "$DUPLICATE_MIGRATIONS" ]; then
            echo "no invalid migrations found"
          else
            echo "🚨 Duplicate migration files found 🚨"
            echo "Migration number: $DUPLICATE_MIGRATIONS is a duplicate\n and needs to be renamed"
            exit 1
          fi

  build-and-push:
    if: github.repository == 'UnlockedLabs/unlocked-core' || github.repository == 'PThorpe92/UnlockEdv2'
    needs: setup-env
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      queue: max
    outputs:
      deployments: ${{ steps.build-images.outputs.deployments }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Version
        run: |
          # main also gets :latest so the existing staging restart flow keeps working.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$TAG' is not a vMAJOR.MINOR.PATCH release tag — refusing to build release images"
              exit 1
            fi
            echo "IMAGE_VERSION=${TAG#v}" >> $GITHUB_ENV
            echo "EXTRA_TAG=" >> $GITHUB_ENV
            # GITHUB_REF_NAME is the tag itself on this path, not a branch —
            # report "unknown" rather than a tag name masquerading as a branch.
            echo "IMAGE_GIT_BRANCH=unknown" >> $GITHUB_ENV
          else
            echo "IMAGE_VERSION=sha-${GITHUB_SHA:0:7}" >> $GITHUB_ENV
            echo "EXTRA_TAG=latest" >> $GITHUB_ENV
            echo "IMAGE_GIT_BRANCH=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Expose GitHub runtime for the build cache
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - id: build-images
        run: |
          # Every push builds and tags both images — a partial set (gated
          # on which folder changed) can't be pinned per-site, can't tell you
          # what staging actually tested, and drops a build's changes entirely
          # if a later push's run replaces it in the concurrency queue.
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          LABELS=(
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.version=$IMAGE_VERSION"
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          )

          echo "Building frontend image"
          # Site name and PostHog key are read at runtime from each
          # deployment's /config.js (EN-176) instead of baked in here —
          # one image now works on every site.
          TAGS=(-t "$REGISTRY/frontend:${IMAGE_VERSION}")
          if [[ -n "$EXTRA_TAG" ]]; then
            TAGS+=(-t "$REGISTRY/frontend:${EXTRA_TAG}")
          fi
          docker buildx build --platform linux/amd64 \
            --cache-from type=gha,scope=frontend --cache-to type=gha,scope=frontend,mode=max \
            "${LABELS[@]}" "${TAGS[@]}" --push frontend/.

          echo "Building backend image"
          TAGS=(-t "$REGISTRY/unlockedv2:${IMAGE_VERSION}")
          if [[ -n "$EXTRA_TAG" ]]; then
            TAGS+=(-t "$REGISTRY/unlockedv2:${EXTRA_TAG}")
          fi
          docker buildx build --platform linux/amd64 \
            --cache-from type=gha,scope=backend --cache-to type=gha,scope=backend,mode=max \
            --build-arg GIT_COMMIT="$GITHUB_SHA" --build-arg GIT_BRANCH="$IMAGE_GIT_BRANCH" --build-arg APP_VERSION="$IMAGE_VERSION" \
            "${LABELS[@]}" "${TAGS[@]}" --push -f backend/Dockerfile .

          echo "deployments=frontend server opencontent-worker providerplatforms-worker" >> $GITHUB_OUTPUT

  restart-deployments:
    if: github.repository == 'UnlockedLabs/unlocked-core' || github.repository == 'PThorpe92/UnlockEdv2'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Restart Deployments via SSM
        env:
          SSM_TARGET_INSTANCE_ID: ${{ secrets.SSM_TARGET_INSTANCE_ID }}
        run: |
          deployments="${{ needs.build-and-push.outputs.deployments }}"
          if [[ -z "$deployments" ]]; then
            echo "No deployments need restarting."
            exit 0
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            NAMESPACE="staging"
          else
            echo "Skipping deployment restarts for ${GITHUB_REF}"
            exit 0
          fi
          # Until EN-184, staging migrates here: copy the chart's suspended
          # CronJob/core-migrate into a Job, then run rollout.sh as before. The
          # server waits for that Job's migrations itself, so it needn't finish
          # first. Before the chart has the CronJob, the copy fails and the
          # restart still runs (unlocked-platform D7).
          JOB="core-migrate-${GITHUB_SHA::8}-${GITHUB_RUN_ATTEMPT}"
          COMMAND="kubectl -n $NAMESPACE create job $JOB --from=cronjob/core-migrate; rollout.sh $NAMESPACE $deployments"
          PARAMETERS=$(jq -n --arg cmd "$COMMAND" '{"commands": [$cmd]}')
          aws ssm send-command \
            --instance-ids "$SSM_TARGET_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Restarting deployments in $NAMESPACE"
