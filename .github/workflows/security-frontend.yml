# Frontend security vulnerability scanning workflow
# Scans for high and critical severity vulnerabilities in frontend dependencies
# Blocks PR merges when vulnerabilities are detected and sends Slack notifications
name: PR Security Check - Frontend Vulnerabilities Scan

on:
  pull_request:
    paths:
      - "frontend/**"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - ".github/workflows/security-frontend.yml"
      - ".github/scan-result.sh"
      - ".github/scan-result_test.sh"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frontend-vulncheck:
    name: Scan Frontend Dependencies for Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test scan classifier
        run: bash .github/scan-result_test.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: |
          cd frontend
          corepack install -g yarn
          yarn install --frozen-lockfile

      - name: Run security audit
        id: vuln-scan
        timeout-minutes: 5
        run: |
          echo "Running yarn audit on frontend dependencies..."

          cd frontend
          set +e
          yarn audit --level=high > ../frontend_audit_output.txt 2>&1
          code=$?
          set -e
          cd ..

          result=$(.github/scan-result.sh yarn "$code" frontend_audit_output.txt)
          echo "yarn audit exit code $code -> $result"

          # yarn 1 prints "Severity: 15 Low | 92 Moderate | 79 High | 2 Critical"
          severity_line=$(grep -m1 '^Severity:' frontend_audit_output.txt || true)
          critical_count=$(echo "$severity_line" | grep -oE '[0-9]+ Critical' | cut -d' ' -f1 || true)
          high_count=$(echo "$severity_line" | grep -oE '[0-9]+ High' | cut -d' ' -f1 || true)
          critical_count=${critical_count:-0}
          high_count=${high_count:-0}
          total_vuln=$((critical_count + high_count))

          echo "Critical: $critical_count, High: $high_count, Total: $total_vuln"

          if [ "$result" = vulnerabilities_found ] && [ "$total_vuln" -eq 0 ]; then
            echo "::warning::yarn reported high or critical findings but the Severity line was not parsed; see the audit output"
          fi

          echo "critical_count=$critical_count" >> "$GITHUB_OUTPUT"
          echo "high_count=$high_count" >> "$GITHUB_OUTPUT"
          echo "total_vuln=$total_vuln" >> "$GITHUB_OUTPUT"

          case "$result" in
            vulnerabilities_found)
              echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
              echo "Security vulnerabilities detected - this PR cannot be merged"
              echo "CRITICAL_COUNT=$critical_count" >> "$GITHUB_ENV"
              echo "HIGH_COUNT=$high_count" >> "$GITHUB_ENV"
              echo "TOTAL_VULN=$total_vuln" >> "$GITHUB_ENV"
              ;;
            clean)
              echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
              echo "No high or critical vulnerabilities found in frontend dependencies"
              ;;
            *)
              echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
              echo "scan_failed=true" >> "$GITHUB_OUTPUT"
              cat frontend_audit_output.txt
              echo "::error::Scan failed (yarn audit exit code $code), re-run"
              exit 1
              ;;
          esac

      - name: Send Slack notification
        if: steps.vuln-scan.outputs.vulnerabilities_found == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          SLACK_MESSAGE=$(cat <<EOF
          FRONTEND SECURITY VULNERABILITIES DETECTED

          SUMMARY: $CRITICAL_COUNT Critical, $HIGH_COUNT High Severity Vulnerabilities Found

          Repository: $REPO
          PR: #$PR_NUMBER - $PR_TITLE
          Author: $PR_AUTHOR
          Branch: $PR_BRANCH

          This PR contains frontend security vulnerabilities and has been blocked from merging until fixed.

          TOTAL: Found $TOTAL_VULN total vulnerabilities affecting frontend dependencies

          Actions needed:
          1. Update each vulnerable package using: \`yarn upgrade <package>@<safe-version>\`
          2. Or update all dependencies: \`yarn upgrade\`
          3. Run \`yarn audit\` to verify fixes
          4. Push updates to PR

          PR Link: $PR_URL
          EOF
          )

          PAYLOAD=$(jq -n --arg text "$SLACK_MESSAGE" '{channel: "#unlockedv2-alerts", username: "Security Bot", icon_emoji: ":warning:", text: $text}')

          if ! curl -X POST -H 'Content-type: application/json' \
               --max-time 10 \
               --silent \
               --fail \
               --data "$PAYLOAD" \
               "$SLACK_WEBHOOK_URL"; then
            echo "Warning: Failed to send Slack notification"
          else
            echo "Slack notification sent successfully to #unlockedv2-alerts"
          fi

      - name: Block PR from merging
        if: steps.vuln-scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "::error::Frontend security vulnerabilities detected - PR blocked from merging"
          exit 1

      - name: Security check summary
        if: always()
        run: |
          if [ "${{ steps.vuln-scan.outputs.vulnerabilities_found }}" == 'true' ]; then
            echo ""
            echo "FRONTEND SECURITY CHECK FAILED"
            echo "This PR CANNOT be merged due to frontend security vulnerabilities."
            echo ""
            echo "Found ${{ steps.vuln-scan.outputs.critical_count }} Critical and ${{ steps.vuln-scan.outputs.high_count }} High vulnerabilities"
            echo ""
            echo "Slack notification sent to #unlockedv2-alerts"
            echo ""
          elif [ "${{ steps.vuln-scan.outputs.scan_failed }}" == 'true' ]; then
            echo "SCAN FAILED - yarn audit did not complete, re-run the job"
          else
            echo "FRONTEND SECURITY CHECK PASSED - No high or critical vulnerabilities found"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-audit-report
          path: frontend_audit_output.txt
          retention-days: 30