name: PR Security Check - Go Vulnerabilities Scan

on:
  pull_request:
    paths:
      - "go.work"
      - "go.work.sum"
      - "backend/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/security-go.yml"
      - ".github/scan-result.sh"
      - ".github/scan-result_test.sh"

permissions:
  contents: read
  actions: read

jobs:
  govulncheck:
    name: Scan Go Dependencies for Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test scan classifier
        run: bash .github/scan-result_test.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: |
            go.work.sum
            backend/go.sum
            backend/migrations/go.sum
            backend/seeder/go.sum

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run vulnerability scan
        id: vuln-scan
        timeout-minutes: 5
        run: |
          echo "Running govulncheck on the backend module..."

          echo "Scanning backend module..."
          cd backend
          set +e
          govulncheck ./... > ../backend_vuln_output.txt 2>&1
          code=$?
          set -e
          cd ..

          result=$(.github/scan-result.sh go "$code")
          echo "govulncheck exit code $code -> $result"

          case "$result" in
            clean)
              echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
              echo "No vulnerabilities found in any Go modules"
              ;;
            vulnerabilities_found)
              echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
              echo "Security vulnerabilities detected - this PR cannot be merged"
              exit 1
              ;;
            *)
              echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
              echo "scan_failed=true" >> "$GITHUB_OUTPUT"
              cat backend_vuln_output.txt
              echo "::error::Scan failed (govulncheck exit code $code), re-run"
              exit 1
              ;;
          esac

      - name: Send Slack notification
        if: failure() && steps.vuln-scan.outputs.vulnerabilities_found == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          BACKEND_VULN=$(cat backend_vuln_output.txt 2>/dev/null || echo "No backend vulnerabilities output")

          VULN_OUTPUT=$(printf "=== BACKEND VULNERABILITIES ===\n%s" "$BACKEND_VULN")

          VULN_TEXT=$(printf '%s' "$VULN_OUTPUT" | head -c 2000)
          if [ ${#VULN_OUTPUT} -gt 2000 ]; then
            VULN_TEXT="$VULN_TEXT... (truncated, see full output in workflow logs)"
          fi

          SLACK_MESSAGE=$(cat <<EOF
          🚨 *SECURITY VULNERABILITIES DETECTED* 🚨

          Repository: $REPO
          PR: #$PR_NUMBER - $PR_TITLE
          Author: $PR_AUTHOR
          Branch: $PR_BRANCH

          This PR contains Go security vulnerabilities and has been blocked from merging until fixed.

          *Vulnerability Details:*
          $VULN_TEXT

          🔧 *Actions needed:*
          1. Update affected dependencies: \`go get -u <package>@<safe-version>\`
          2. Push updates to the PR

          *PR Link:* $PR_URL
          EOF
          )

          PAYLOAD=$(jq -n --arg text "$SLACK_MESSAGE" '{channel: "#unlockedv2-alerts", username: "Security Bot", icon_emoji: ":warning:", text: $text}')

          if ! curl -X POST -H 'Content-type: application/json' \
               --max-time 10 \
               --silent \
               --fail \
               --data "$PAYLOAD" \
               "$SLACK_WEBHOOK_URL"; then
            echo "Warning: Failed to send Slack notification"
          else
            echo "Slack notification sent successfully to #unlockedv2-alerts"
          fi

      - name: Security check summary
        if: always()
        run: |
          if [ "${{ steps.vuln-scan.outputs.vulnerabilities_found }}" == 'true' ]; then
            echo ""
            echo "SECURITY CHECK FAILED"
            echo "This PR CANNOT be merged due to security vulnerabilities."
            echo ""
            echo "To fix these vulnerabilities:"
            echo "  For backend module:"
            echo "    1. cd backend"
            echo "    2. go get -u <package>@<safe-version>"
            echo "    3. Push updates to your PR"
            echo ""
            echo "Slack notification sent to #unlockedv2-alerts"
            echo ""
          elif [ "${{ steps.vuln-scan.outputs.scan_failed }}" == 'true' ]; then
            echo "SCAN FAILED - govulncheck did not complete, re-run the job"
          else
            echo "SECURITY CHECK PASSED - No vulnerabilities found in any Go modules"
          fi
