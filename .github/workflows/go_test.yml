name: Go Tests 
on:
  pull_request:
    branches: ["main", "release/**"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Build every module without go.work
        env:
          GOWORK: "off"
        run: |
          for m in backend backend/migrations backend/seeder; do
            (cd "$m" && go build -o /dev/null ./...)
          done

      - name: Test
        run: |
          cd backend
          go test -v ./...
